<button type="button" class="modal-overlay" (click)="dismiss.emit()" [attr.aria-label]="'modal.closeForm' | i18n"></button>
<dialog class="modal-sheet" open [attr.aria-labelledby]="'modal-title'" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
  <header class="modal-header">
    <button class="modal-close" (click)="dismiss.emit()" [attr.aria-label]="'modal.closeForm' | i18n">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6l1.4 1.4L12 13.4l5.6 5.6 1.4-1.4L13.4 12z" />
      </svg>
    </button>
    <h2 id="modal-title" class="modal-title">{{ title() }}</h2>
    <div class="modal-spacer"></div>
  </header>

  <main class="modal-content">
    <ng-content></ng-content>
  </main>
</dialog>
