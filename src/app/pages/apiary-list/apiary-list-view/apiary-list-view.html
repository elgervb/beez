@if (apiaries().length > 0) {
  <ul class="card-list"
      beeListKeyboardNav
      focusSelector="li.card-row .card-link"
      [items]="apiaries()"
      (editItem)="editApiary.emit($event)"
      (deleteItem)="deleteApiary.emit($event.id)">
    @for (apiary of apiaries(); track apiary.id) {
      <li class="card-row"
          [beeSwipeToDeleteRow]="apiary.id"
          (beeSwipeDelete)="deleteApiary.emit($event)">
        <div class="swipe-reveal">{{ 'common.delete' | i18n }}</div>
        <a [routerLink]="['/apiary', apiary.id]" class="card-link">
          <div class="card-body">
            <strong>{{ apiary.name }}</strong>
            <p>{{ apiary.location }}</p>
          </div>
          <bee-badge [label]="'apiary.hivesLabel' | i18n:{ count: (hiveCounts()[apiary.id] ?? 0) }" variant="neutral" appearance="outline" size="small" />
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l1.4-1.4 6.4 6.4a1 1 0 0 1 0 1.4l-6.4 6.4L9 17.4l5.7-5.7z"/></svg>
        </a>
        <bee-row-actions
          [editAriaLabel]="'apiary.edit' | i18n"
          [deleteAriaLabel]="'apiary.delete' | i18n"
          (editItem)="editApiary.emit(apiary)"
          (deleteItem)="deleteApiary.emit(apiary.id)" />
      </li>
    }
  </ul>
} @else {
  <bee-empty-state
    [title]="'apiaries.empty' | i18n"
    [hint]="'apiaries.emptyHint' | i18n"
    [actionLabel]="'apiaries.addNew' | i18n"
    iconPath="M11.35 3.4a1 1 0 0 1 1.3 0l7 6a1 1 0 0 1-1.3 1.52L18 10.66V19a2 2 0 0 1-2 2h-2.5a1 1 0 0 1-1-1v-4h-1v4a1 1 0 0 1-1 1H8a2 2 0 0 1-2-2v-8.34l-.35.26a1 1 0 0 1-1.3-1.52z"
    (action)="addRequested.emit()"
  />
}
