<section class="panel">
  <h2>{{ initial() ? 'Edit apiary' : 'New apiary' }}</h2>
  <form class="form-grid" (submit)="onSubmit($event)">
    <label>
      Name
      <input autofocus [formField]="form.name" placeholder="West Orchard" autocomplete="off" inputmode="text" [class.field-invalid]="showNameError()" />
      @if (showNameError()) {
        <span class="field-error">Name is required</span>
      }
    </label>
    <label>
      Location
      <input [formField]="form.location" placeholder="My place" autocomplete="off" inputmode="text" [class.field-invalid]="showLocationError()" />
      @if (showLocationError()) {
        <span class="field-error">Location is required</span>
      }
    </label>
    <label class="full">
      Notes
      <textarea [formField]="form.notes" rows="2" placeholder="Access gate code, bloom status..."></textarea>
    </label>
    <div class="row-buttons">
      <button type="button" class="btn-secondary" (click)="dismissed.emit()">Cancel</button>
      <button type="submit">{{ initial() ? 'Update apiary' : 'Save apiary' }}</button>
    </div>
  </form>
</section>
