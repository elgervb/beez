<main class="auth-wrap">
  <section class="auth-card" aria-label="Sign in">
    <h1>{{ mode() === 'login' ? 'Sign in' : 'Create account' }}</h1>

    <div class="mode-tabs" role="tablist">
      <button role="tab" [class.active]="mode() === 'login'" (click)="setMode('login')">Sign in</button>
      <button role="tab" [class.active]="mode() === 'register'" (click)="setMode('register')">Register</button>
    </div>

    @if (mode() === 'login') {
      <label>
        Email
        <input
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        />
      </label>
      <label>
        Password
        <input
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          (keydown.enter)="signInWithEmailPassword()"
        />
      </label>
      <div class="actions">
        <button type="button" (click)="signInWithEmailPassword()" [disabled]="busy()">Sign in</button>
      </div>
    }

    @if (mode() === 'register') {
      <p class="hint">Fill in your details to create a new account.</p>
      <label>
        Email
        <input
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        />
      </label>
      <label>
        Password
        <input
          type="password"
          autocomplete="new-password"
          placeholder="At least 6 characters"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          (keydown.enter)="register()"
        />
      </label>
      <div class="actions">
        <button type="button" (click)="register()" [disabled]="busy()">Create account</button>
      </div>
    }

    @if (message()) {
      <p class="message" aria-live="polite">{{ message() }}</p>
    }
  </section>
</main>
