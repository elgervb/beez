<main class="auth-wrap">
  <section class="auth-card" [attr.aria-label]="'auth.signIn' | i18n">
    <h1>{{ mode() === 'login' ? ('auth.signIn' | i18n) : ('auth.createAccount' | i18n) }}</h1>

    <div class="mode-tabs" role="tablist">
      <button role="tab" [class.active]="mode() === 'login'" (click)="setMode('login')">{{ 'auth.signIn' | i18n }}</button>
      <button role="tab" [class.active]="mode() === 'register'" (click)="setMode('register')">{{ 'auth.register' | i18n }}</button>
    </div>

    @if (mode() === 'login') {
      <label>
        {{ 'auth.email' | i18n }}
        <input
          type="email"
          autocomplete="email"
          [placeholder]="'auth.emailPlaceholder' | i18n"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        />
      </label>
      <label>
        {{ 'auth.password' | i18n }}
        <input
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          (keydown.enter)="signInWithEmailPassword()"
        />
      </label>
      <div class="actions">
        <button type="button" (click)="signInWithEmailPassword()" [disabled]="busy()">{{ 'auth.signIn' | i18n }}</button>
      </div>
    }

    @if (mode() === 'register') {
      <p class="hint">{{ 'auth.fillDetails' | i18n }}</p>
      <label>
        {{ 'auth.email' | i18n }}
        <input
          type="email"
          autocomplete="email"
          [placeholder]="'auth.emailPlaceholder' | i18n"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        />
      </label>
      <label>
        {{ 'auth.password' | i18n }}
        <input
          type="password"
          autocomplete="new-password"
          [placeholder]="'auth.passwordMinHint' | i18n"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          (keydown.enter)="register()"
        />
      </label>
      <div class="actions">
        <button type="button" (click)="register()" [disabled]="busy()">{{ 'auth.createAccount' | i18n }}</button>
      </div>
    }

    @if (message()) {
      <p class="message" aria-live="polite">{{ message() }}</p>
    }
  </section>
</main>
