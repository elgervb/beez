<section class="panel">
  <h2>{{ initial() ? 'Edit hive' : 'New hive' }}</h2>
  <form class="form-grid" (submit)="onSubmit($event)">
    <label>
      Hive code
      <input autofocus [formField]="form.code" placeholder="A-03" autocomplete="off" inputmode="text" [class.field-invalid]="showCodeError()" />
      @if (showCodeError()) {
        <span class="field-error">Hive code is required</span>
      }
    </label>
    <label>
      Queen year
      <input [formField]="form.queenYear" type="number" inputmode="numeric" autocomplete="off" [class.field-invalid]="showQueenYearError()" />
      @if (showQueenYearError()) {
        <span class="field-error">{{ formModel().queenYear < 2019 ? 'Queen year must be 2019 or later' : 'Queen year must be 2100 or earlier' }}</span>
      }
    </label>
    <label>
      Temperament
      <select [formField]="form.temperament">
        <option value="calm">Calm</option>
        <option value="mixed">Mixed</option>
        <option value="defensive">Defensive</option>
      </select>
    </label>
    <label>
      Status
      <select [formField]="form.status">
        <option value="active">Active</option>
        <option value="weak">Weak</option>
        <option value="wintering">Wintering</option>
      </select>
    </label>
    <label class="full">
      Notes
      <textarea [formField]="form.notes" rows="2" placeholder="Location notes, behaviour, feeding..."></textarea>
    </label>
    <div class="row-buttons">
      <button type="button" class="btn-secondary" (click)="dismissed.emit()">Cancel</button>
      <button type="submit">{{ initial() ? 'Update hive' : 'Save hive' }}</button>
    </div>
  </form>
</section>
