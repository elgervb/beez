<section class="panel">
  <h2>{{ initial() ? ('hive.edit' | i18n) : ('hive.create' | i18n) }}</h2>
  <form class="form-grid" (submit)="onSubmit($event)">
    <label>
      {{ 'hive.code' | i18n }}
      <input autofocus [formField]="form.code" [placeholder]="'hive.codePlaceholder' | i18n" autocomplete="off" inputmode="text" [class.field-invalid]="showCodeError()" />
      @if (showCodeError()) {
        <span class="field-error">{{ 'hive.codeRequired' | i18n }}</span>
      }
    </label>
    <label>
      {{ 'hive.queenYear' | i18n }}
      <input [formField]="form.queenYear" type="number" inputmode="numeric" autocomplete="off" [class.field-invalid]="showQueenYearError()" />
      @if (showQueenYearError()) {
        <span class="field-error">{{ formModel().queenYear < 2019 ? ('hive.queenYearMin' | i18n) : ('hive.queenYearMax' | i18n) }}</span>
      }
    </label>
    <label>
      {{ 'hive.temperament' | i18n }}
      <select [formField]="form.temperament">
        <option value="calm">{{ 'hive.temperamentCalm' | i18n }}</option>
        <option value="mixed">{{ 'hive.temperamentMixed' | i18n }}</option>
        <option value="defensive">{{ 'hive.temperamentDefensive' | i18n }}</option>
      </select>
    </label>
    <label>
      {{ 'hive.status' | i18n }}
      <select [formField]="form.status">
        <option value="active">{{ 'hive.statusActive' | i18n }}</option>
        <option value="weak">{{ 'hive.statusWeak' | i18n }}</option>
        <option value="wintering">{{ 'hive.statusWintering' | i18n }}</option>
      </select>
    </label>
    <label class="full">
      {{ 'hive.notes' | i18n }}
      <textarea [formField]="form.notes" rows="2" [placeholder]="'hive.notesPlaceholder' | i18n"></textarea>
    </label>
    <div class="row-buttons">
      <button type="button" class="btn-secondary" (click)="dismissed.emit()">{{ 'common.cancel' | i18n }}</button>
      <button type="submit">{{ initial() ? ('hive.update' | i18n) : ('hive.save' | i18n) }}</button>
    </div>
  </form>
</section>
