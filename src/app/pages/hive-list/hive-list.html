<bee-app-shell
  tab="hives"
  [hivesLink]="['/apiary', apiaryId]"
  [backLink]="'/'"
  [backLabel]="'apiaries.title' | i18n"
  [eyebrow]="apiary()?.location ?? ''"
  [title]="apiary()?.name ?? ('hives.title' | i18n)"
>
  <button shell-header-action class="btn-add" (click)="openAdd()">{{ 'common.add' | i18n }}</button>

  <div shell-content class="hive-content">
    @if (syncError()) {
      <bee-badge [label]="syncError()" variant="warning" icon="warning" appearance="soft" size="small" />
    }

    @if (hives().length > 4) {
      <section class="controls-panel" aria-label="Hive filters">
        <bee-search-filter-bar
          [value]="search()"
          [expanded]="searchExpanded()"
          [placeholder]="'hives.search' | i18n"
          [ariaLabel]="'common.search' | i18n"
          (valueChange)="setSearch($event)"
          (expandedChange)="searchExpanded.set($event)"
        />
        <select [value]="statusFilter()" (change)="setStatusFilter($any($event.target).value)">
          <option value="all">{{ 'hive.inspections' | i18n }}</option>
          <option value="active">{{ 'hive.inspections' | i18n }}</option>
          <option value="weak">{{ 'hive.inspections' | i18n }}</option>
          <option value="wintering">{{ 'hive.inspections' | i18n }}</option>
        </select>
      </section>
    }

    @if (selectedHiveIds().length > 0) {
      <div class="bulk-actions">
        <bee-badge [label]="selectedHiveIds().length + ' selected'" variant="neutral" appearance="outline" size="small" />
        <button type="button" (click)="applyBulkStatus('active')">{{ 'hive.inspections' | i18n }}</button>
        <button type="button" (click)="applyBulkStatus('weak')">{{ 'hive.inspections' | i18n }}</button>
        <button type="button" (click)="applyBulkStatus('wintering')">{{ 'hive.inspections' | i18n }}</button>
      </div>
    }

    @if (dueNowHives().length > 0) {
      <section class="due-panel">
        <h2>{{ 'hive.inspections' | i18n }}</h2>
        <div class="due-list">
          @for (hive of dueNowHives(); track hive.id) {
            <button type="button" class="due-item" (click)="openHiveInspections(hive.id)">
              <span>{{ hive.code }}</span>
              <bee-badge [label]="hive.label" variant="warning" icon="warning" [pulse]="true" appearance="soft" size="small" />
            </button>
          }
        </div>
      </section>
    }

    <bee-hive-list-view [apiaryId]="apiaryId" [hives]="filteredHives()" [inspectionLabels]="inspectionLabels()"
      [healthScores]="healthScores()" [trendLabels]="trendLabels()" [dueLabels]="dueLabels()" [isDueByHive]="isDueByHive()"
      [selectedIds]="selectedHiveIds()" (toggleSelected)="toggleHiveSelection($event)"
      (editHive)="openEdit($event)" (deleteHive)="deleteHive($event)" (addRequested)="openAdd()" />

    @if (pendingDeletedHive()) {
      <bee-undo-bar [message]="'hive.deleted' | i18n" (action)="undoDeleteHive()" />
    }
  </div>
</bee-app-shell>

@if (modal.isOpen()) {
  <bee-modal-sheet [title]="editingHive() ? ('hive.edit' | i18n) : ('hive.add' | i18n)" (dismiss)="closeModal()">
    <bee-hive-form [initial]="editingHive()" (save)="saveHive($event)" (dismissed)="closeModal()" />
  </bee-modal-sheet>
}
