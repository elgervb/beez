<section class="panel">
  <h2>{{ initial() ? 'Edit inspection' : 'Log inspection' }}</h2>
  <div class="preset-row" aria-label="Quick presets">
    <button type="button" class="preset-btn" (click)="applyPreset('routine')">Routine</button>
    <button type="button" class="preset-btn" (click)="applyPreset('low-stores')">Low stores</button>
    <button type="button" class="preset-btn" (click)="applyPreset('follow-up')">Follow-up</button>
  </div>
  <form class="form-grid" (submit)="onSubmit($event)">
    <label>
      Date
      <input [formField]="form.date" type="date" />
    </label>
    <label>
      Brood pattern
      <select [formField]="form.broodPattern">
        <option value="excellent">Excellent</option>
        <option value="good">Good</option>
        <option value="poor">Poor</option>
      </select>
    </label>
    <label>
      Stores
      <select [formField]="form.storesLevel">
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </label>
    <label>
      Inspector
      <input autofocus [formField]="form.inspector" placeholder="Your name" autocomplete="off" inputmode="text" list="inspectors-list" [class.field-invalid]="showInspectorError()" />
      @if (knownInspectors().length > 0) {
        <datalist id="inspectors-list">
          @for (name of knownInspectors(); track name) {
            <option [value]="name"></option>
          }
        </datalist>
      }
      @if (showInspectorError()) {
        <span class="field-error">Inspector name is required</span>
      }
    </label>
    <label class="switch-row">
      <input type="checkbox" [formField]="form.broodSeen"
        (change)="formModel.update(f => ({ ...f, open: $any($event.target).checked ? f.open : false }))" />
      Brood seen
    </label>
    @if (showOpenBrood()) {
      <label class="switch-row">
        <input type="checkbox" [formField]="form.open" />
        Open brood seen
      </label>
    }
    <label class="full">
      Notes
      <textarea [formField]="form.notes" rows="3" placeholder="Temperament, queen sighted, feeding needed..."></textarea>
    </label>
    <div class="full tasks-section">
      <span class="tasks-label">Tasks for next inspection</span>
      @if (tasks().length > 0) {
        <ul class="task-list">
          @for (task of tasks(); track $index) {
            <li class="task-item">
              <span class="task-text">{{ task }}</span>
              <button type="button" class="btn-remove-task" (click)="removeTask($index)" aria-label="Remove task">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
              </button>
            </li>
          }
        </ul>
      }
      <div class="task-input-row">
        <input
          type="text"
          class="task-input"
          placeholder="Add a task..."
          [value]="newTask()"
          (input)="newTask.set($any($event.target).value)"
          (keydown)="addTaskOnEnter($event)"
        />
        <button type="button" class="btn-add-task" (click)="addTask()">Add</button>
      </div>
    </div>
    <div class="row-buttons">
      <button type="button" class="btn-secondary" (click)="dismissed.emit()">Cancel</button>
      <button type="submit">{{ initial() ? 'Update inspection' : 'Save inspection' }}</button>
    </div>
  </form>
</section>
